[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "masterflex-reglo-control"
dynamic = ["version"]
description = "Desktop app that runs a Masterflex REGLO peristaltic pump over EtherNet/IP: set flow, dispense by time or volume, and log each run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Brandon T. McReynolds" }]
keywords = ["masterflex", "reglo", "peristaltic-pump", "ethernet-ip", "cip", "pyqt6", "lab-automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Keep requirements.txt in step with this list (the launchers and build_app.py use it).
dependencies = [
    "PyQt6>=6.5",
    "pyqtdarktheme>=0.1.7", # 2.x supports Python < 3.12 only; 0.1.7 is picked on newer Pythons
    "pycomm3>=1.2.14",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/brandonbtm29/Masterflex-REGLO-Pump-Ethernet-Control"
Changelog = "https://github.com/brandonbtm29/Masterflex-REGLO-Pump-Ethernet-Control/blob/master/CHANGELOG.md"
Issues = "https://github.com/brandonbtm29/Masterflex-REGLO-Pump-Ethernet-Control/issues"

# Start the app with `masterflex-reglo` after `pip install -e .` (no console window on Windows).
[project.gui-scripts]
masterflex-reglo = "pump_gui:main"

[tool.hatch.version]
path = "pump_gui.py"

# A flat, script-style app: run it from the clone. The wheel only exists so that
# `pip install -e ".[dev]"` can install the dependencies and dev tools.
[tool.hatch.build.targets.wheel]
only-include = ["pump_gui.py", "dispense.py", "protocol.py", "runlog.py", "settings_location.py", "shortcuts.py", "updates.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
# settings_location.py is shared byte-for-byte with the other UAkron apps; leave it as is.
extend-exclude = ["build", "dist", "settings_location.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"] # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
# E402: imports deliberately follow the data-folder setup at the top of the file.
# E501: long UI strings and stylesheets.
# S603/S606/S607: opens files/folders with the OS default app, fixed arguments.
"pump_gui.py" = ["E402", "E501", "S603", "S606", "S607"]
"build_app.py" = ["S603", "S607"]
# Launchers have to be executable (0o755, like any installed app).
"shortcuts.py" = ["S103"]
"scripts/*" = ["E402"]
"tests/*" = ["S603", "S607"] # tests run git with fixed arguments
